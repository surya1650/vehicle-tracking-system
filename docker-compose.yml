services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anpr
      POSTGRES_DB: anpr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ANPR_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr -d anpr"]
      interval: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    user: "${ANPR_CONTAINER_USER:-10001}"
    environment:
      DATABASE_URL: postgresql+psycopg://anpr:${POSTGRES_PASSWORD}@db:5432/anpr
      API_SIGNING_KEY: ${API_SIGNING_KEY:?Set API_SIGNING_KEY in .env}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Asia/Kolkata}
      ANPR_IMAGE_RETENTION_DAYS: ${ANPR_IMAGE_RETENTION_DAYS:-30}
    ports:
      - "${ANPR_BIND_ADDRESS:-127.0.0.1}:${ANPR_API_PORT:-8010}:8010"
    volumes:
      - ./data/snapshots:/app/data/snapshots:ro
      - ./data/live:/app/data/live:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
