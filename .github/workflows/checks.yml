name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux vision and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: anpr
          POSTGRES_USER: anpr
          POSTGRES_PASSWORD: ${{ github.run_id }}${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anpr -d anpr"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://anpr:${{ github.run_id }}${{ github.run_attempt }}@127.0.0.1:5432/anpr
      ANPR_TEST_DATABASE_URL: postgresql+psycopg://anpr:${{ github.run_id }}${{ github.run_attempt }}@127.0.0.1:5432/anpr
      ANPR_TEST_VIDEO: data/videos/anpr-demo-video.mp4
      ANPR_TEST_OCR_PYTHON: .venv-ocr/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0t64
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-tracking.txt -r requirements-api.txt -r requirements-dev.txt
          python -m venv .venv-ocr
          .venv-ocr/bin/python -m pip install -r requirements-ocr.txt
      - run: python validation/fetch_assets.py
      - run: python -m alembic upgrade head && python -m alembic check
      - run: python -m pytest -q

  windows:
    name: Windows CPU vision
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      ANPR_TEST_VIDEO: data/videos/anpr-demo-video.mp4
      ANPR_TEST_OCR_PYTHON: .venv-ocr/Scripts/python.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-tracking.txt -r requirements-dev.txt
          python -m venv .venv-ocr
          .venv-ocr/Scripts/python.exe -m pip install -r requirements-ocr.txt
      - run: python validation/fetch_assets.py
      - name: Run vision tests
        run: python -m pytest -q --ignore=tests/test_api.py

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
